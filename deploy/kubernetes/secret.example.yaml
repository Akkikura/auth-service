apiVersion: v1
kind: Secret
metadata:
  name: auth-service
  labels:
    app.kubernetes.io/name: auth-service
type: Opaque
stringData:
  POSTGRES_URL: postgresql://user:password@postgres.example:5432/auth?sslmode=require
  REDIS_ADDRESS: redis.example:6379
  REDIS_USERNAME: auth-service
  REDIS_PASSWORD: replace-me
  AUTH_SESSION_HASH_KEY: replace-with-a-random-secret-of-at-least-32-bytes
